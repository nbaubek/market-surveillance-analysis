<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <!-- surface -->
  <rect width="860" height="500" fill="#fcfcfb"/>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#0b0b0b">The order book, the spread, and book imbalance</text>
  <text x="30" y="56" font-size="12.5" fill="#52514e">Displayed quantity by price — bids (buy orders) far left, asks (sell orders) far right</text>

  <!-- ===== BIDS ===== -->
  <text x="130" y="92" font-size="12.5" font-weight="700" fill="#2a78d6" text-anchor="middle">BIDS</text>
  <!-- best bid: 800 @ 140.25 -->
  <rect x="40" y="104" width="180" height="30" rx="4" fill="#2a78d6"/>
  <text x="50" y="124" font-size="12.5" fill="#ffffff">800 sh</text>
  <text x="242" y="124" font-size="12.5" fill="#0b0b0b" font-weight="700">140.25</text>
  <text x="242" y="139" font-size="10" fill="#898781">best bid (the touch)</text>
  <!-- 140.24 -->
  <rect x="40" y="142" width="90" height="26" rx="4" fill="#86b6ef"/>
  <text x="50" y="159" font-size="12" fill="#0b0b0b">400</text>
  <text x="242" y="156" font-size="12" fill="#52514e">140.24</text>
  <!-- 140.23 -->
  <rect x="40" y="176" width="56" height="26" rx="4" fill="#b7d3f6"/>
  <text x="50" y="193" font-size="12" fill="#0b0b0b">250</text>
  <text x="242" y="188" font-size="12" fill="#52514e">140.23</text>

  <!-- ===== SPREAD (between the touches) ===== -->
  <line x1="420" y1="119" x2="420" y2="229" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="412" y1="119" x2="428" y2="119" stroke="#c3c2b7" stroke-width="1"/>
  <line x1="412" y1="229" x2="428" y2="229" stroke="#c3c2b7" stroke-width="1"/>
  <text x="442" y="150" font-size="12" fill="#52514e">spread</text>
  <text x="442" y="167" font-size="12" font-weight="700" fill="#0b0b0b">$0.01</text>
  <text x="442" y="184" font-size="10" fill="#898781">the instant</text>
  <text x="442" y="197" font-size="10" fill="#898781">transaction cost</text>

  <!-- ===== ASKS ===== -->
  <text x="670" y="92" font-size="12.5" font-weight="700" fill="#e34948" text-anchor="middle">ASKS</text>
  <!-- best ask: 200 @ 140.26 -->
  <rect x="625" y="216" width="45" height="26" rx="4" fill="#e34948"/>
  <text x="600" y="233" font-size="12.5" fill="#0b0b0b" font-weight="700" text-anchor="end">140.26</text>
  <text x="600" y="248" font-size="10" fill="#898781" text-anchor="end">best ask (the touch)</text>
  <text x="679" y="233" font-size="12" fill="#0b0b0b">200 sh</text>
  <!-- 140.27 -->
  <rect x="625" y="250" width="79" height="26" rx="4" fill="#f2a09f"/>
  <text x="600" y="267" font-size="12" fill="#52514e" text-anchor="end">140.27</text>
  <text x="712" y="267" font-size="12" fill="#0b0b0b">350</text>
  <!-- 140.28 -->
  <rect x="625" y="284" width="34" height="26" rx="4" fill="#f8c9c8"/>
  <text x="600" y="301" font-size="12" fill="#52514e" text-anchor="end">140.28</text>
  <text x="667" y="301" font-size="12" fill="#0b0b0b">150</text>

  <!-- ===== AGGRESSOR ===== -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0b0b0b"/>
    </marker>
  </defs>
  <path d="M 80 344 C 300 344, 520 326, 615 244" fill="none" stroke="#0b0b0b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="80" y="370" font-size="12" fill="#0b0b0b" font-weight="700">Market buy order (the aggressor)</text>
  <text x="80" y="386" font-size="11" fill="#52514e">crosses the spread, pays 140.26 — its side is what</text>
  <text x="80" y="400" font-size="11" fill="#52514e">order-flow imbalance measures</text>

  <!-- ===== IMBALANCE ===== -->
  <rect x="30" y="416" width="800" height="72" rx="8" fill="#f4f4f1" stroke="#e1e0d9"/>
  <text x="48" y="438" font-size="12.5" font-weight="700" fill="#0b0b0b">book imbalance (top of book)</text>
  <text x="48" y="458" font-size="12" fill="#52514e">(bid depth − ask depth) / (bid depth + ask depth)</text>
  <text x="48" y="478" font-size="12.5" fill="#52514e">= (800 − 200) / (800 + 200) = <tspan font-size="13" font-weight="700" fill="#2a78d6">+0.6 — bid-heavy</tspan></text>
</svg>
