version: 2

models:
  - name: itch_mbo_cleaned
    description: >
      Deduplicated MBO message stream. Same grain as bronze (one row per
      message event), minus two classes of Databento SYNTHETIC book
      management, both excluded as non-market activity: (1) R book-clear
      records (the clear-book part of the synthetic start-of-day snapshot,
      one per trading day), and (2) the day-boundary cleanup burst — C rows
      within the first second of each UTC day that cancel orders left
      resting from the previous session (AAPL ~900-1300/day; MSFT none).
      The burst rows carry ts_event at day start but sequence numbers from
      the prior session's space, which breaks sequence/time monotonicity
      and corrupts sequence-ordered, timestamp-stamped replay intervals.
      Incremental merge on message_key: by default every run re-processes
      a 5-day rolling window; explicit start_date/end_date vars backfill
      any range idempotently (matched messages update in place, new ones
      insert).
    columns:
      - name: message_key
        description: >
          Null-safe md5 surrogate of the full message identity (symbol,
          ts_event, sequence, order_id, action, price, size). Athena MERGE
          joins on plain '=' and NULL never equals NULL, so system rows
          (NULL price/order_id) need the encoded form for re-merges to stay
          idempotent. This test also enforces the key is always populated.
        data_tests: [not_null]
      - name: symbol
        description: Raw Databento symbol (identity partition).
        data_tests: [not_null]
      - name: ts_event
        description: Exchange event time, microsecond UTC.
        data_tests: [not_null]
      - name: action
        description: >
          Message action code: A=add, M=modify, C=cancel, T=trade, F=fill,
          N=none (cross trades and other side-less events). Book-clear
          records (R) — the clear-book part of Databento's synthetic
          start-of-day order-book snapshot, no price, one per trading day —
          are not market activity and are excluded from silver; the model
          filters them and this test enforces they never reappear.
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'M', 'C', 'T', 'F', 'N']
      - name: side
        description: >
          Order side. A=ask, B=bid, N=not-applicable (system rows).
        data_tests:
          - accepted_values:
              arguments:
                values: ['A', 'B', 'N']
      - name: price
        description: Price as DECIMAL(18,9); NULL on system rows (DBN UNDEF sentinel).
      - name: ts_event_day
        description: Trading day derived from ts_event (identity partition).
        data_tests: [not_null]

  - name: message_flags
    description: >
      Silver enrichment, one row per itch_mbo_cleaned message (same
      message_key): message-group classification per the verified Rules 1+3
      in knowledge-base/02-dataset-and-events.md. An annotation table, not a copy — consumers
      join on message_key and take only the flag columns. Incremental merge
      with the same dual-mode window as itch_mbo_cleaned (5-day catch-up
      default; start_date/end_date vars for backfill). This is the single
      source of truth for execution/replace/standalone-cancel
      classification: never re-derive the window logic in a consumer.
    columns:
      - name: message_key
        description: >
          Join key back to itch_mbo_cleaned.message_key (the same null-safe
          md5 surrogate). One row per message.
        data_tests: [not_null]
      - name: action
        description: Denormalized from silver for standalone-cancel context.
      - name: channel_id
        description: >
          Denormalized message-group member (part of the group identity
          with ts_event_day and sequence).
      - name: sequence
        description: >
          Denormalized message-group member; resets each trading day
          (verified empirically; sequence resets daily).
      - name: in_execution_group
        description: >
          TRUE when this message's group (ts_event_day, channel_id,
          sequence) contains a T or F row — i.e. the row belongs to an
          execution message (T+F+C triple, or F+C when non-printable).
      - name: in_replace_group
        description: >
          TRUE when this message's group contains an A row — i.e. the C is
          the modify leg of an order replace (C old + A new). NOTE: this is
          trivially TRUE for every A row (its own leg); it classifies C
          rows. To classify A rows use in_cancel_group.
      - name: in_cancel_group
        description: >
          TRUE when this message's group contains a C row. For A rows this
          marks the new-order leg of a replace pair (C old + A new, Rule 3)
          as opposed to a genuine new add.
      - name: is_standalone_cancel
        description: >
          TRUE for a trader-initiated cancel: action = C, group has no
          execution leg and no replace leg. The churn /
          layering-spoofing-grade cancellation count; mechanical legs are
          excluded by construction.
        data_tests: [not_null]
      - name: symbol
        description: Ticker (identity partition).
        data_tests: [not_null]
      - name: ts_event_day
        description: Trading day derived from ts_event (identity partition).
        data_tests: [not_null]
