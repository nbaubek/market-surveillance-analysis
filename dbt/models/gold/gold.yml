version: 2

models:
  - name: hourly_liquidity_metrics
    description: >
      Gold Phase 1: hourly liquidity metrics per (symbol, ts_event_day,
      hour) over the silver message stream. Full rebuild every run (gold
      volume is tiny). Cancel semantics follow the verified message rules
      in gold-layer-plan.md: standalone_cancels excludes execution legs
      (C inside a T/F message group) and replace legs (C inside an A+C
      group); trades counts tape prints (T) only — F is a separate
      fills metric so executions are never double-counted.
    columns:
      - name: symbol
        description: Ticker (from silver identity partition).
        data_tests: [not_null]
      - name: event_hour
        description: UTC hour (0–23) of ts_event. Hours with no messages have no row.
      - name: messages
        description: All MBO messages in the hour (any action).
      - name: adds
        description: Add-order messages (A).
      - name: cancels
        description: >
          All cancel messages (C), unfiltered — includes mechanical
          execution legs and replace legs.
      - name: standalone_cancels
        description: >
          Trader-initiated cancels: C whose message group contains no T/F
          (execution) and no A (replace leg). The layering/spoofing-grade
          cancellation count.
        data_tests: [not_null]
      - name: trades
        description: >
          Tape prints (T) — includes crosses (side N). F rows are NOT
          counted here: same executions, would double-count.
      - name: fills
        description: >
          Resting-order executions (F), independent of tape printability
          (non-printable executions emit F+C without T).
      - name: trade_volume
        description: Sum of size over T rows (shares). 0 for hours with no trades.
      - name: notional_volume
        description: >
          Sum of price * size over T rows, DOUBLE (dollar turnover). The
          cross-symbol comparable volume measure.
      - name: vwap
        description: >
          Volume-weighted average price over T rows, DOUBLE. NULL for hours
          with no trades.
      - name: open
        description: >
          First T price in the hour (tape-based; includes crosses). NULL for
          hours with no trades.
      - name: high
        description: Highest T price in the hour. NULL for hours with no trades.
      - name: low
        description: Lowest T price in the hour. NULL for hours with no trades.
      - name: close
        description: >
          Last T price in the hour (tape-based; includes crosses). NULL for
          hours with no trades.
      - name: avg_trade_size
        description: trade_volume / trades. NULL for hours with no trades.
      - name: range_bps
        description: >
          (high − low) / vwap * 10000 — hourly trading range in basis points
          of VWAP. NULL for hours with no trades.
      - name: vwap_premium
        description: >
          close / vwap − 1 — where the hour's last price ended relative to
          its volume-weighted average. NULL for hours with no trades.
      - name: cancel_to_add_ratio
        description: cancels / adds (unfiltered counts); NULL when adds = 0.
      - name: messages_per_minute
        description: messages / 60 — mean message rate across the hour.
      - name: ts_event_day
        description: Trading day derived from ts_event (identity partition).
        data_tests: [not_null]

  - name: minute_liquidity_metrics
    description: >
      Minute-grain mirror of hourly_liquidity_metrics: one row per (symbol,
      ts_event_day, UTC minute of day) with the same metric semantics
      (verified message rules in gold-layer-plan.md; flags via the
      message_flags join). Exists because hourly buckets cannot answer
      time-weighted questions — burst detection, TWAP, realized volatility,
      and minute bars for charts are all derived from this table (see
      daily_summary's minute-derived columns). Minutes with no messages
      produce no row; minutes with messages but no trades have NULL price
      columns. Full rebuild every run.
    columns:
      - name: symbol
        description: Ticker.
        data_tests: [not_null]
      - name: event_minute
        description: UTC minute of day (0–1439) = hour * 60 + minute.
      - name: messages
        description: All MBO messages in the minute (any action).
      - name: adds
        description: Add-order messages (A).
      - name: cancels
        description: All cancel messages (C), unfiltered (execution + replace legs included).
      - name: standalone_cancels
        description: >
          Trader-initiated cancels (no execution leg, no replace leg in the
          message group), from message_flags.
        data_tests: [not_null]
      - name: trades
        description: Tape prints (T); F excluded (would double-count).
      - name: trade_volume
        description: Sum of size over T rows (shares).
      - name: notional_volume
        description: Sum of price * size over T rows, DOUBLE (dollar turnover).
      - name: vwap
        description: Minute VWAP over T rows, DOUBLE. NULL for minutes with no trades.
      - name: open
        description: First T price in the minute. NULL for minutes with no trades.
      - name: high
        description: Highest T price in the minute. NULL for minutes with no trades.
      - name: low
        description: Lowest T price in the minute. NULL for minutes with no trades.
      - name: close
        description: Last T price in the minute. NULL for minutes with no trades.
      - name: ts_event_day
        description: Trading day (identity partition).
        data_tests: [not_null]

  - name: volume_profile
    description: >
      Volume-by-price distribution, one row per (symbol, ts_event_day,
      10-cent price bucket) over T rows (crosses included). The horizontal
      volume profile for dashboards; use volume_share for cross-symbol
      comparisons (fixed 10-cent bins are symbol-specific — a $140 and a $5
      stock bin very differently; revisit bin width if small caps land).
      Full rebuild every run.
    columns:
      - name: symbol
        description: Ticker.
        data_tests: [not_null]
      - name: price_bucket
        description: >
          Bin index in dimes, floor(price * 10) — e.g. 1402 covers
          $140.20–140.29.
      - name: price_bucket_floor
        description: Lower edge of the bin in dollars (price_bucket / 10).
      - name: trades
        description: Tape prints (T) in the bucket.
      - name: trade_volume
        description: Shares traded (T size) in the bucket.
      - name: notional_volume
        description: Dollar turnover in the bucket, DOUBLE.
      - name: volume_share
        description: >
          This bucket's share of the symbol-day's traded volume
          (sums to 1 per symbol-day).
      - name: ts_event_day
        description: Trading day (identity partition).
        data_tests: [not_null]

  - name: daily_summary
    description: >
      One row per (symbol, ts_event_day): the dashboard landing table,
      aggregating hourly_liquidity_metrics and, for time-weighted metrics,
      minute_liquidity_metrics. Day open/close come from the hourly values
      (earliest/latest hour with trades), day VWAP is recomputed from summed
      notional/shares. Metric semantics inherit the verified message rules
      in gold-layer-plan.md unchanged.
    columns:
      - name: symbol
        description: Ticker.
        data_tests: [not_null]
      - name: active_hours
        description: >
          Number of UTC hours with at least one message (max 24; overnight
          silence produces no hours).
      - name: peak_message_hour
        description: UTC hour with the most messages (ties resolve arbitrarily).
      - name: messages
        description: All MBO messages in the day.
      - name: adds
        description: Add-order messages (A).
      - name: cancels
        description: All cancel messages (C), unfiltered (execution + replace legs included).
      - name: standalone_cancels
        description: >
          Trader-initiated cancels (no execution leg, no replace leg in the
          message group). The layering/spoofing-grade cancellation count.
        data_tests: [not_null]
      - name: trades
        description: Tape prints (T) in the day; F excluded (would double-count).
      - name: fills
        description: Resting-order executions (F).
      - name: trade_volume
        description: Sum of size over T rows (shares).
      - name: notional_volume
        description: Sum of price * size over T rows, DOUBLE (dollar turnover).
      - name: vwap
        description: >
          Day volume-weighted average price over T rows, recomputed from
          summed notional/shares (not an average of hourly VWAPs). NULL for
          days with no trades.
      - name: open
        description: Day's first T price (open of earliest hour with trades). NULL if no trades.
      - name: high
        description: Day's highest T price. NULL if no trades.
      - name: low
        description: Day's lowest T price. NULL if no trades.
      - name: close
        description: Day's last T price (close of latest hour with trades, i.e. after the closing cross). NULL if no trades.
      - name: avg_trade_size
        description: trade_volume / trades. NULL for days with no trades.
      - name: range_bps
        description: (high − low) / vwap * 10000 — day range in bps of VWAP. NULL if no trades.
      - name: vwap_premium
        description: close / vwap − 1. NULL if no trades.
      - name: cancel_to_add_ratio
        description: Day cancels / adds (unfiltered counts); NULL when adds = 0.
      - name: cancel_to_trade_ratio
        description: >
          Day standalone_cancels / trades — classic layering/spoofing
          indicator; MUST use standalone cancels (raw C counts are inflated
          by execution and replace legs, see Rule 1/3 in gold-layer-plan.md).
      - name: peak_minute_messages
        description: >
          Max per-minute message count over active minutes (minutes with no
          messages produce no row) — the burst-detection peak.
      - name: burst_ratio
        description: >
          peak_minute_messages / mean per-minute messages (active minutes) —
          how spiky the day's message rate is relative to its own average.
          NULL when the day has no minutes.
      - name: twap
        description: >
          Time-weighted average price: mean of traded-minute closes.
          Minute-grain approximation — silent minutes between trades are
          skipped, not zero-filled. NULL for days with no trades.
      - name: realized_vol_bps
        description: >
          Realized volatility: sqrt of summed squared close-to-close minute
          log returns, in basis points. Computed over consecutive TRADED
          minutes (sparse-minute approximation of true realized variance);
          NULL for days with fewer than two traded minutes.
      - name: ts_event_day
        description: Trading day (identity partition).
        data_tests: [not_null]
